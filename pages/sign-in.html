<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalian | Sign In</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- HEADER AND NAVIGATION -->
    <header>
        <nav class="bg-gray-900 text-white" aria-label="Main navigation">

            <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

                <a href="../index.html" class="text-2xl font-bold">
                    Kalian
                </a>

                <div class="flex gap-6">
                    <a href="../index.html" class="hover:text-blue-400">Home</a>
                    <a href="about.html" class="hover:text-blue-400">About</a>
                    <a href="contact.html" class="hover:text-blue-400">Contact</a>
                    <a href="sign-in.html" class="hover:text-blue-400" aria-current="page">Sign In</a>
                    <a href="sign-up.html" class="hover:text-blue-400">Sign Up</a>
                </div>

            </div>

        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="min-h-[calc(100vh-80px)] flex items-center justify-center px-6 py-16">

        <section class="w-full max-w-md" aria-labelledby="signin-title">

            <!-- Header -->
            <header class="text-center mb-8">

                <p class="text-blue-600 font-semibold">
                    WELCOME BACK
                </p>

                <h1 id="signin-title" class="text-3xl md:text-4xl font-bold text-gray-900 mt-2">
                    Sign In
                </h1>

                <p class="text-gray-600 mt-3">
                    Sign in to continue to your Kalian account.
                </p>

            </header>

            <!-- Form Card -->
            <article class="bg-white rounded-xl shadow-sm p-8">

                <form>

                    <!-- Email -->
                    <div class="mb-5">

                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>

                    <!-- Password -->
                    <div class="mb-5">

                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>

                    <!-- Remember + Forgot -->
                    <div class="flex items-center justify-between mb-6">

                        <label class="flex items-center gap-2 text-sm text-gray-600">

                            <input
                                type="checkbox"
                                name="remember"
                                class="h-4 w-4"
                            >

                            Remember me

                        </label>

                        <a href="#" class="text-sm text-blue-600 hover:text-blue-700">
                            Forgot Password?
                        </a>

                    </div>

                    <!-- Submit -->
                    <button
                        type="submit"
                        class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700"
                    >
                        Sign In
                    </button>

                </form>

                <!-- Divider -->
                <div class="flex items-center gap-4 my-6">

                    <div class="h-px bg-gray-200 flex-1"></div>

                    <span class="text-sm text-gray-500">
                        OR
                    </span>

                    <div class="h-px bg-gray-200 flex-1"></div>

                </div>

                <!-- Sign Up -->
                <p class="text-center text-sm text-gray-600">

                    Don't have an account?

                    <a href="sign-up.html"
                       class="text-blue-600 font-medium hover:text-blue-700">
                        Create one
                    </a>

                </p>

            </article>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-950 text-gray-400">

        <div class="max-w-7xl mx-auto px-6 py-8">

            <div class="flex flex-col md:flex-row items-center justify-between gap-4">

                <p class="text-sm">
                    © 2026 Kalian. All rights reserved.
                </p>

                <nav class="flex gap-6 text-sm" aria-label="Footer navigation">

                    <a href="../index.html" class="hover:text-white">
                        Home
                    </a>

                    <a href="about.html" class="hover:text-white">
                        About
                    </a>

                    <a href="contact.html" class="hover:text-white">
                        Contact
                    </a>

                </nav>

            </div>

        </div>

    </footer>

</body>

</html>
