<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalian | Sign Up</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- NAVBAR -->
    <nav class="bg-gray-900 text-white">

        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

            <a href="../index.html" class="text-2xl font-bold">
                Kalian
            </a>

            <div class="flex gap-6">
                <a href="../index.html" class="hover:text-blue-400">Home</a>
                <a href="about.html" class="hover:text-blue-400">About</a>
                <a href="contact.html" class="hover:text-blue-400">Contact</a>
                <a href="sign-in.html" class="hover:text-blue-400">Sign In</a>
                <a href="sign-up.html" class="hover:text-blue-400">Sign Up</a>
            </div>

        </div>

    </nav>


    <!-- SIGN UP -->
    <main class="min-h-[calc(100vh-80px)] flex items-center justify-center px-6 py-16">

        <div class="w-full max-w-md">

            <!-- Header -->
            <div class="text-center mb-8">

                <p class="text-blue-600 font-semibold">
                    JOIN KALIAN
                </p>

                <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mt-2">
                    Create an Account
                </h1>

                <p class="text-gray-600 mt-3">
                    Create your account and get started with Kalian.
                </p>

            </div>


            <!-- Form Card -->
            <div class="bg-white rounded-xl shadow-sm p-8">

                <form>

                    <!-- Full Name -->
                    <div class="mb-5">

                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            placeholder="Your full name"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>


                    <!-- Email -->
                    <div class="mb-5">

                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            placeholder="you@example.com"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>


                    <!-- Password -->
                    <div class="mb-5">

                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            placeholder="Create a password"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="mb-5">

                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>


                    <!-- Terms -->
                    <div class="flex items-start gap-2 mb-6">

                        <input
                            type="checkbox"
                            class="h-4 w-4 mt-1"
                        >

                        <p class="text-sm text-gray-600">
                            I agree to the terms and conditions.
                        </p>

                    </div>


                    <!-- Submit -->
                    <button
                        type="submit"
                        class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700"
                    >
                        Create Account
                    </button>

                </form>


                <!-- Divider -->
                <div class="flex items-center gap-4 my-6">

                    <div class="h-px bg-gray-200 flex-1"></div>

                    <span class="text-sm text-gray-500">
                        OR
                    </span>

                    <div class="h-px bg-gray-200 flex-1"></div>

                </div>


                <!-- Sign In -->
                <p class="text-center text-sm text-gray-600">

                    Already have an account?

                    <a href="sign-in.html"
                       class="text-blue-600 font-medium hover:text-blue-700">
                        Sign In
                    </a>

                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="bg-gray-950 text-gray-400">

        <div class="max-w-7xl mx-auto px-6 py-8">

            <div class="flex flex-col md:flex-row items-center justify-between gap-4">

                <p class="text-sm">
                    © 2026 Kalian. All rights reserved.
                </p>

                <div class="flex gap-6 text-sm">

                    <a href="../index.html" class="hover:text-white">
                        Home
                    </a>

                    <a href="about.html" class="hover:text-white">
                        About
                    </a>

                    <a href="contact.html" class="hover:text-white">
                        Contact
                    </a>

                </div>

            </div>

        </div>

    </footer>

</body>

</html>
